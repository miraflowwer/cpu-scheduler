<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CPU scheduler source map</title>
<style>
body{font:1.1rem/1.6 system-ui;color:#183547;background:#edf4f6;max-width:50rem;margin: auto;padding:3rem 1rem}button{font:inherit;padding:.5rem;margin:.2rem;border:1px solid #486575;border-radius:.4rem;background:white}button[aria-pressed=true]{color:white;background:#21516a}output{display:block;padding:1.5rem;background:white;border-left:.4rem solid #29836b;margin-top:1rem}
</style>
<h1>Follow one run</h1><p>Select a Java class to see what it does.</p>
<nav aria-label="Java classes"></nav><output aria-live="polite"></output>
<script>
const roles = {
  Main: 'Reads the menu and the job times. Calls the chosen algorithm and prints the results.',
  CpuProcess: 'Stores one job. Subtracts arrival from completion to find turnaround time.',
  CpuScheduler: 'Chooses a ready job, moves the clock forward, and records when each job finishes.',
  GanttChart: 'Stores the end time of each turn. Prints a box or a line of text for each interval.'
};
for (const [name, role] of Object.entries(roles)) {
  const button = document.createElement('button');
  button.textContent = name;
  button.onclick = () => {
    for (const item of document.querySelectorAll('button')) item.setAttribute('aria-pressed', String(item === button));
    document.querySelector('output').textContent = role;
  };
  document.querySelector('nav').append(button);
}
document.querySelector('button').click();
</script></html>
